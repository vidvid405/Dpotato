<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipper-FA</title>

<style>
body{
    margin:0;
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:monospace;
}

#screen{
    width:420px;
    height:300px;
    background:#b9d69d;
    border:10px solid #444;
    border-radius:15px;
    color:#111;
    padding:20px;
    box-sizing:border-box;
}

h1{
    text-align:center;
    margin-top:60px;
}

#loading{
    width:100%;
    height:20px;
    border:2px solid #000;
    margin-top:30px;
}

#bar{
    width:0%;
    height:100%;
    background:#111;
    animation:load 3s forwards;
}

@keyframes load{
    from{width:0%;}
    to{width:100%;}
}
</style>

</head>

<body>

<div id="screen">

<h1>Flipper-FA</h1>

<p style="text-align:center;">Booting...</p>

<div id="loading">
<div id="bar"></div>
</div>

</div>

</body>
</html>
