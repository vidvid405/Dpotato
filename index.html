<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ThePotato OS</title>

<link rel="stylesheet" href="style.css">
</head>

<body>
<div id="boot">

    <h1>ThePotato OS</h1>

    <p>Initializing system...</p>

    <div id="bootBar">

        <div id="bootProgress"></div>

    </div>

</div>
<div id="device">

<header id="statusBar">
    <span id="logo">ThePotato OS</span>
    <span id="status">READY</span>
    <span id="clock">00:00</span>
</header>

<main id="screen">

<div id="left">

<h1>Dpotato</h1>

<ul id="menu">
<li class="selected">Radio</li>
<li>Infrared</li>
<li>NFC</li>
<li>RFID</li>
<li>Bluetooth</li>
<li>Utilities</li>
<li>Games</li>
<li>Settings</li>
<li>About</li>
</ul>

</div>

<div id="right">

<div id="potatoBox">

<img id="potato"
src="potato.svg"
alt="Dpotato">

</div>

<div id="terminal">

SYSTEM READY

</div>

</div>

</main>

<footer>

↑ ↓ Move &nbsp;&nbsp; Enter Open

</footer>

</div>

<script src="script.js"></script>

</body>
</html>
