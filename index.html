<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ThePotato OS</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="boot">

<h1>ThePotato OS</h1>

<p id="bootText">Booting...</p>

<div id="bootBar">

<div id="bootProgress"></div>

</div>

</div>

<div id="device">

<header id="statusBar">

<div>ThePotato OS</div>

<div id="status">READY</div>

<div id="clock">00:00</div>

</header>

<main id="screen">

<section id="left">

<h1>Dpotato</h1>

<ul id="menu">

<li class="selected">Radio</li>
<li>Infrared</li>
<li>NFC</li>
<li>RFID</li>
<li>Bluetooth</li>
<li>Utilities</li>
<li>Games</li>
<li>Settings</li>
<li>About</li>

</ul>

</section>

<section id="right">

<img
id="potato"
src="potato.svg"
alt="Dpotato">

<div id="terminal">

SYSTEM READY

</div>

</section>

</main>

<footer>

↑ ↓ Move
&nbsp;&nbsp;&nbsp;
Enter Open

</footer>

</div>

<script src="script.js"></script>

</body>
</html>
